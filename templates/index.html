<!DOCTYPE html>
<html>

<head>

<title>Smart Chick Counter</title>

<meta http-equiv="refresh" content="2">

<style>

body{
    text-align:center;
    font-family:Arial;
    background:#f5f5f5;
}

h1{
    color:green;
}

.count{
    font-size:70px;
    color:red;
    font-weight:bold;
}

.status{
    font-size:30px;
    color:blue;
}

button{
    padding:15px 30px;
    font-size:20px;
    margin:10px;
    cursor:pointer;
}

img{
    border:3px solid black;
}

</style>

</head>

<body>

<h1>🐥 SMART CHICK COUNTER</h1>

<div class="status">
Status: {{ status }}
</div>

<br>

<div class="count">
{{ count }}
</div>

<br>

<a href="/start">
<button>▶ Start Counting</button>
</a>

<a href="/stop">
<button>⏹ Stop Counting</button>
</a>

<a href="/reset">
<button>🔄 Reset Count</button>
</a>

<br><br>

<img src="/video" width="900">

</body>

</html>
